[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shrimp"
version = "0.1.0"
description = "Tiny IDs for big language models. Maps UUIDs to short, category-prefixed aliases optimized for LLM context windows."
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "fakeredis>=2.0",
    "mypy>=1.9",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shrimp"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
